name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 배포가 겹치면 컨테이너 교체 중 충돌하므로 직렬화한다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cmu02/pick-trip-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 실행 가능 jar 빌드
        run: ./gradlew bootJar

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시 (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: 배포 전 필수 환경변수 키 목록 추출
        id: envkeys
        run: |
          # prod 설정이 요구하는 환경변수를 yaml 에서 직접 뽑는다. 별도 목록 파일을 두면 갱신을 잊는다.
          # 기본값이 붙은 형태(콜론 포함)는 누락돼도 기동되므로 패턴에 걸리지 않는다.
          keys=$(grep -oE '\$\{[A-Z0-9_]+\}' src/main/resources/application-prod.yaml | tr -d '${}' | sort -u | tr '\n' ' ')
          echo "keys=$keys" >> "$GITHUB_OUTPUT"

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REQUIRED_KEYS: ${{ steps.envkeys.outputs.keys }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,SHA,REQUIRED_KEYS
          script: |
            set -e

            # application-prod.yaml 이 요구하는 키가 운영 .env 에 모두 있는지 확인한다.
            # 구버전 컨테이너를 건드리기 전에 검사해야 누락 시 서비스가 무중단으로 유지된다.
            MISSING=""
            for key in $REQUIRED_KEYS; do
              grep -q "^${key}=" /opt/picktrip/.env || MISSING="$MISSING $key"
            done
            if [ -n "$MISSING" ]; then
              echo "운영 .env 에 누락된 키:$MISSING"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$SHA"

            # 롤백: 신규 컨테이너를 제거하고 구버전을 원래 이름으로 되돌려 재기동한다.
            rollback() {
              docker rm -f picktrip 2>/dev/null || true
              docker rename picktrip-old picktrip 2>/dev/null || true
              docker start picktrip 2>/dev/null || true
            }

            # 구버전을 즉시 삭제하지 않고 보존한다. 신규 기동이 실패하면 이 컨테이너로 되돌린다.
            docker rename picktrip picktrip-old 2>/dev/null || true
            docker stop picktrip-old 2>/dev/null || true

            # 8081 은 루프백에만 바인딩한다. 외부 노출은 nginx 가 담당하므로 보안그룹 변경이 필요 없다.
            docker run -d --name picktrip --restart unless-stopped \
              -p 127.0.0.1:8081:8080 \
              --memory=1g \
              --log-opt max-size=10m --log-opt max-file=3 \
              --env-file /opt/picktrip/.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              "$IMAGE:$SHA" || { echo "컨테이너 기동 실패"; rollback; exit 1; }

            for i in $(seq 1 36); do
              if curl -sf http://127.0.0.1:8081/actuator/health > /dev/null; then
                echo "헬스체크 통과"

                # 구버전을 제거하고, 이전 태그 이미지만 정리한다.
                # prune -af 는 호스트 전역이라 같은 EC2 의 다른 프로젝트 이미지까지 지우므로
                # 이 이미지 저장소의 최신/현재 태그를 제외한 태그만 좁혀서 지운다.
                docker rm -f picktrip-old 2>/dev/null || true
                docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}}' \
                  | grep -v ":latest$" | grep -v ":$SHA$" \
                  | xargs -r docker rmi 2>/dev/null || true

                exit 0
              fi
              sleep 5
            done

            echo "헬스체크 실패 - 최근 로그"
            docker logs --tail 100 picktrip

            rollback
            exit 1
