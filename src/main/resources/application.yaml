spring:
  application:
    name: PickTrip

  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        # 카카오는 구글과 달리 CommonOAuth2Provider 내장 항목이 아니므로 엔드포인트를 직접 정의한다.
        # 환경과 무관한 고정값이라 프로필별 파일이 아닌 여기에 둔다. client-id·secret 만 프로필에서 주입한다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          kakao:
            client-name: Kakao
            authorization-grant-type: authorization_code
            # 카카오 토큰 API 는 Basic 인증 헤더를 받지 않고 client_secret 을 본문으로 받는다.
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image

  # TourAPI 상세 조회 캐시. 상세 1건은 detailCommon2·detailIntro2·detailImage2 로 3콜을 쓰므로
  # 같은 콘텐츠 재조회를 막는 것만으로 일일 요청량이 크게 줄어든다.
  # TTL 24h: 콘텐츠 기본 정보는 자주 바뀌지 않으며 동기화 배치 주기도 주 1회다.
  cache:
    cache-names: contentDetail
    caffeine:
      spec: expireAfterWrite=24h,maximumSize=500,recordStats

  # 스키마는 Flyway 로만 변경한다. 컬럼 추가 시 db/migration 에 V{n}__설명.sql 을 추가하면 부팅 시 자동 적용된다.
  # 기존 RDS 에는 이미 테이블이 있으므로 baseline 을 허용하고, 버전 0 으로 잡아 V1 부터 실행되게 한다.
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate # Flyway 가 스키마를 관리하므로 검증만 한다. update/create 로 바꾸지 않는다.
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        # 지연 로딩되는 컬렉션을 IN 쿼리로 묶어 가져와 N+1 을 막는다.
        # 한 쿼리에서 List(bag) 두 개를 fetch join 할 수 없는 제약(MultipleBagFetchException)의 대안이다.
        default_batch_fetch_size: 100

  # AI 일정 생성 (OpenAI). API 키는 .env 로 주입하며 Git 에 커밋하지 않는다.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
          model: ${OPENAI_MODEL:gpt-5.1}
    # MCP 서버 (SSE/HTTP) — 프론트 팀원 AI 클라이언트에 read-only API 문서 제공
    mcp:
      server:
        name: picktrip-api-docs
        version: 1.0.0
        type: SYNC
        instructions: >-
          PickTrip 백엔드 REST API 문서를 read-only 로 제공합니다.
          listEndpoints / getEndpoint / searchEndpoints / getErrorContract 도구로
          엔드포인트 목록·상세 스키마·공통 에러 계약을 조회하세요.
        capabilities:
          tool: true

app:
  oauth2:
    # 앱(모바일)이 client=app 으로 시작한 로그인의 최종 콜백. 커스텀 스킴이어야 인앱 브라우저가 닫히고
    # 앱이 code 를 받는다. 환경과 무관한 고정값이라 프로필별 파일이 아닌 여기에 둔다.
    # Expo Go 로 테스트할 때만 OAUTH2_APP_REDIRECT_URI 로 exp://<host>/--/auth/callback 을 주입한다.
    app-redirect-uri: ${OAUTH2_APP_REDIRECT_URI:picktrip://auth/callback}
