spring:
  datasource:
    url: jdbc:mysql://${DB_URL}:${DB_PORT}/${DB_SCHEMA}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # RDS 가 비용 절감을 위해 정기적으로 중지된다. 기본값(idle 10 유지)이면 중지 시간대에
    # housekeeper 가 유휴 커넥션을 계속 재생성 시도해 "Pool is empty" 로그가 쌓이고,
    # 그 시간대 요청은 30초를 꽉 채워 실패하며 Tomcat 스레드를 잡아먹는다.
    hikari:
      minimum-idle: 0          # 유휴 커넥션을 유지하지 않아 반복 재연결 로그가 사라진다.
      maximum-pool-size: 5     # 단일 인스턴스 + t3.small 급 RDS 규모에 맞춘 상한.
      connection-timeout: 5000 # 30초 대기 대신 5초 만에 실패시켜 스레드 점유를 줄인다.
      keepalive-time: 120000   # 2분마다 유휴 커넥션에 핑을 보내 중간 방화벽/idle timeout 보다 먼저 갱신한다.
      max-lifetime: 1800000    # 기본값(30분). MySQL wait_timeout(기본 8시간)보다 충분히 짧다.
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          # 나머지 카카오 설정(provider, scope 등)은 application.yaml 에 있다.
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET_PASSWORD}
  docker:
    compose:
      enabled: false

# Cloudflare 와 nginx 를 거치므로 X-Forwarded-* 를 신뢰해야 한다.
# 이게 없으면 {baseUrl} 이 http 로 잡혀 OAuth redirect_uri mismatch 가 난다.
server:
  forward-headers-strategy: NATIVE

public-data-portal:
  key:
    encode: ${PUBLIC_DATA_PORTAL_KEY}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expire-time: 3600000   # 1시간 (ms)
  refresh-token-expire-time: 14       # 14일 (days)

app:
  cors:
    allowed-origins: https://pick-trip.app
    # 자격 증명(쿠키) 교차 오리진 허용 여부. 프론트는 Bearer 헤더를 쓰므로 필요 시에만 켠다.
    allow-credentials: true
  share:
    # 공유 링크 접두사. 뒤에 /{토큰} 이 붙어 클라이언트가 그대로 복사·전달한다.
    # 도메인은 환경 변수로 주입한다. 웹 공유 페이지가 분리되면 이 값만 교체하면 된다.
    link-base-url: ${SHARE_LINK_BASE_URL}
  oauth2:
    # 웹 클라이언트 콜백. 웹 프론트 도메인(pick-trip.app)이며, 백엔드(api.pick-trip.app)가 아니다.
    # allowed-origins 와 같은 오리진이어야 하고, apex 에 A 레코드가 붙기 전까지는 NXDOMAIN 이 난다.
    redirect-uri: ${OAUTH2_REDIRECT_URI}
    # 운영은 HTTPS 이므로 인가요청 쿠키에 Secure 를 강제한다.
    cookie-secure: true
    # 일회용 교환 코드 수명(초). 콜백 직후 즉시 교환되므로 짧게 둔다.
    exchange-code-ttl-seconds: 60
    # 개시 브라우저 바인딩 nonce 수명(초). 소셜 로그인 왕복 시간을 감안한다.
    nonce-ttl-seconds: 300

tour-api:
  base-url: ${BASE_URL}
  photo-base-url: ${PHOTO_BASE_URL}
  service-key: ${PUBLIC_DATA_PORTAL_KEY}