plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}
ext {
    springCloudVersion = "2025.1.1"
    testcontainersVersion = "2.0.5"
    springAiVersion = "2.0.0"
}

group = 'travel_agency'
version = '0.0.1-SNAPSHOT'
description = 'PickTrip'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 탈퇴 30일 경과 계정 하드 삭제 배치. 실행 이력을 BATCH_* 메타 테이블에 남긴다 (DDL 은 Flyway V4).
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // TourAPI 상세 조회 캐시. 일일 요청 한도(개발계정 1,000건)를 넘기지 않도록 같은 콘텐츠 재조회를 막는다.
    // TTL 이 필요해 ConcurrentMapCacheManager 대신 Caffeine 을 쓴다.
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // 스키마 변경 이력 관리. ddl-auto 는 validate 를 유지하고 DDL 은 마이그레이션 스크립트로만 나간다.
    // Boot 4 부터 자동설정이 spring-boot-flyway 모듈로 분리되어 flyway-core 만으로는 동작하지 않는다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    testImplementation platform("org.testcontainers:testcontainers-bom:$testcontainersVersion")
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-api
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-impl
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-jackson
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-aop
    implementation 'org.springframework.boot:spring-boot-starter-aop:4.0.0-M2'
    implementation 'io.github.openfeign:feign-jackson'

    // API 문서: OpenAPI 3 생성 (MCP 문서 서버의 스펙 원천)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // MCP 서버 (SSE/HTTP, Spring MVC) — 프론트 팀원 AI 클라이언트에 read-only API 문서 제공
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
        mavenBom "org.springframework.ai:spring-ai-bom:$springAiVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
